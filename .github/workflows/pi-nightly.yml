name: Pi Nightly

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when upstream has not changed
        required: false
        default: false
        type: boolean

concurrency:
  group: pi-nightly
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
      version: ${{ steps.sync.outputs.version }}
      tag: ${{ steps.sync.outputs.tag }}
      conflict: ${{ steps.sync.outputs.conflict }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pi-nightly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global rerere.enabled true
          git config --global rerere.autoupdate true
          git config rerere.enabled true
          git config rerere.autoupdate true

      - id: sync
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          # Add upstream if missing
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/pingdotgg/t3code.git
          fi
          git fetch upstream main --prune
          git fetch origin main --prune || true

          # ── 1. Keep fork's main tracking upstream/main (no patch) ──
          upstream_main=$(git rev-parse upstream/main)
          origin_main=$(git ls-remote origin main 2>/dev/null | awk '{print $1}' || echo "")
          if [ -z "$origin_main" ]; then
            echo "origin/main missing — creating from upstream/main"
            git push origin upstream/main:main || echo "push main failed (may need --force)"
          elif [ "$origin_main" != "$upstream_main" ]; then
            echo "Syncing origin/main $origin_main -> $upstream_main"
            git push --force origin upstream/main:main || echo "force push main failed"
          else
            echo "origin/main already up to date ($origin_main)"
          fi

          # ── 2. Rebase pi-nightly onto upstream/main ──
          before=$(git rev-parse HEAD)
          echo "Before rebase: $before"
          echo "Upstream: $upstream_main"

          set +e
          git rebase upstream/main
          rebase_status=$?
          set -e

          if [ $rebase_status -ne 0 ]; then
            echo "Rebase conflict detected"
            git rebase --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$before" >> "$GITHUB_OUTPUT"
            base=$(node -p 'require("./apps/desktop/package.json").version.split("-")[0]' 2>/dev/null || echo "0.0.0")
            version="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=pi-v$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          after=$(git rev-parse HEAD)
          changed=false
          if [[ "$before" != "$after" || "$FORCE" == "true" ]]; then
            changed=true
            echo "Pushing pi-nightly $before -> $after"
            git push --force-with-lease origin HEAD:pi-nightly
          else
            echo "No changes to pi-nightly"
          fi

          base=$(node -p 'require("./apps/desktop/package.json").version.split("-")[0]')
          version="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "sha=$after" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=pi-v$version" >> "$GITHUB_OUTPUT"

      - name: Create issue on rebase conflict
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" --search "Pi rebase conflict in:title state:open" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Open rebase conflict issue already exists — skipping"
            exit 0
          fi
          cat > /tmp/issue-body.md <<'ISSUE'
          Automated rebase of `pi-nightly` onto `upstream/main` failed with conflicts.

          **What happened**
          - `git rebase upstream/main` on `pi-nightly` hit conflicts. No push was made.
          - The Pi integration patch needs manual resolution.

          **How to fix (one command)**
          ```bash
          git fetch upstream main
          git checkout pi-nightly
          git rebase upstream/main
          # resolve conflicts, then
          git add -A && git rebase --continue
          git push --force-with-lease origin pi-nightly
          ```

          `rerere` is enabled globally in the workflow and locally via `git config --global rerere.enabled true`, so the next identical conflict will auto-resolve.

          **Logs**
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Upstream: https://github.com/pingdotgg/t3code
          - Trigger: `pi-nightly` schedule / `workflow_dispatch`

          After fixing, close this issue. The next scheduled sync will verify tests.
          ISSUE
          gh issue create --repo "${{ github.repository }}" --title "Pi rebase conflict — manual fix needed" --body-file /tmp/issue-body.md --label "pi-nightly" 2>/dev/null || \
          gh issue create --repo "${{ github.repository }}" --title "Pi rebase conflict — manual fix needed" --body-file /tmp/issue-body.md

  validate:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.conflict == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp check
      - run: vp run --filter t3 --filter @t3tools/web typecheck
      - run: vp run --filter t3 test

  report-validate-failure:
    needs: [sync, validate]
    if: failure() && needs.sync.outputs.conflict == 'false' && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" --search "Pi patch broken in:title state:open" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Open 'Pi patch broken' issue already exists"
            exit 0
          fi
          cat > /tmp/issue-body.md <<ISSUE
          Automated **validation failed** for `pi-nightly` after rebasing onto latest `upstream/main`.

          **SHA:** \`${{ needs.sync.outputs.sha }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`vp check\`, \`typecheck\` or \`vp test\` failed. The rebased commit was already pushed to \`origin/pi-nightly\`.

          **How to fix**
          ```bash
          git checkout pi-nightly
          git log --oneline origin/main..HEAD   # your Pi patch commits
          vp check && vp run --filter t3 --filter @t3tools/web typecheck && vp run --filter t3 test
          # fix, commit, then
          git push --force-with-lease origin pi-nightly
          ```

          Close this issue once `pi-nightly` is green. Consider promoting only a known-good SHA to a \`pi-stable\` branch for machines like \`buggy\`.
          ISSUE
          gh issue create --repo "${{ github.repository }}" --title "Pi patch broken after upstream rebase — tests failing" --body-file /tmp/issue-body.md --label "pi-nightly" 2>/dev/null || \
          gh issue create --repo "${{ github.repository }}" --title "Pi patch broken after upstream rebase — tests failing" --body-file /tmp/issue-body.md

  build-desktop:
    needs: [sync, validate]
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.conflict == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            target: dmg
            arch: arm64
            rust: aarch64-apple-darwin
            artifact: mac-arm64
          - os: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust: x86_64-unknown-linux-gnu
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
      T3CODE_DESKTOP_UPDATE_REPOSITORY: raviteja7748/t3code
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - run: vp run --filter @t3tools/desktop ensure:electron
      - name: Build unsigned desktop package
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.sync.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  build-server:
    needs: [sync, validate]
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.conflict == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"
      - run: vp run --filter @t3tools/web build
      - run: vp run --filter t3 build
      - name: Pack server with production dependencies
        run: |
          rm -rf release/t3-pi-server release/t3-pi-server.tar.gz
          npx pnpm@11.10.0 deploy --filter t3 --prod --legacy release/t3-pi-server
          tar -C release -czf release/t3-pi-server.tar.gz t3-pi-server
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: release/t3-pi-server.tar.gz
          if-no-files-found: error

  release:
    needs: [sync, build-desktop, build-server]
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.conflict == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          target_commitish: ${{ needs.sync.outputs.sha }}
          name: T3 Code Pi ${{ needs.sync.outputs.version }}
          body: |
            Automated build of current upstream T3 Code plus the Pi RPC integration.
            macOS builds are unsigned; use the repository installer to update safely.
          prerelease: true
          files: release/*
          fail_on_unmatched_files: true
